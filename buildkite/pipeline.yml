# NOTE: On this test branch only, this is the github-actions plugin PR-title-lint
# test. The bare `buildkite-agent pipeline upload` in the pipeline's UI step
# auto-resolves to this file. (The promise-failure step remains on main.)
#
# The plugin's custom-importer path (explicit `workflow:`) requires the step to
# have a `key` AND the agent to export BUILDKITE_STEP_KEY (buildkite-agent
# >= v3.129). On older agents this step fails with:
#   buildkite-gha: upload: BUILDKITE=true and BUILDKITE_STEP_KEY are required
steps:
  - label: ":github: GitHub Actions — PR title lint"
    key: github-actions
    plugins:
      - github-actions#v0.17.0:
          version: v0.136.0
          workflow: .buildkite/gha/pr_title_lint.yml
