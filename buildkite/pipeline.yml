steps:
  - label: ":memo: Heavy Log Output"
    command: |
      for group in $(seq 1 10); do
        echo "--- Group $group: Processing"
        for line in $(seq 1 50); do
          echo "[$group] Log line $line: $(date) - processing item $line with status OK"
        done
      done

  - label: ":arrows_counterclockwise: Many Log Groups"
    command: |
      echo "--- Setup"
      echo "Initialising environment..."
      sleep 1

      echo "--- Dependencies"
      for dep in lodash express react webpack babel typescript eslint prettier jest; do
        echo "Installing $dep..."
        sleep 0.1
      done

      echo "--- Compilation"
      for file in $(seq 1 20); do
        echo "Compiling src/module-$file.ts -> dist/module-$file.js"
      done

      echo "--- Unit Tests"
      for test in $(seq 1 30); do
        echo "  ✓ test case $test passed ($(( RANDOM % 100 ))ms)"
      done

      echo "--- Integration Tests"
      for test in $(seq 1 15); do
        echo "  ✓ integration test $test passed ($(( RANDOM % 500 ))ms)"
      done

      echo "--- Code Coverage"
      for module in $(seq 1 10); do
        echo "  module-$module: $(( RANDOM % 40 + 60 ))% coverage"
      done

      echo "--- Linting"
      for file in $(seq 1 25); do
        echo "  Linting src/module-$file.ts... OK"
      done

      echo "--- Security Scan"
      for check in "SQL Injection" "XSS" "CSRF" "Auth" "Secrets" "Deps" "CVE Scan"; do
        echo "  Checking $check... PASSED"
        sleep 0.1
      done

      echo "--- Build Artifacts"
      for artifact in $(seq 1 10); do
        echo "  Packaging artifact-$artifact.tar.gz ($(( RANDOM % 900 + 100 ))KB)"
      done

      echo "--- Upload"
      for artifact in $(seq 1 10); do
        echo "  Uploading artifact-$artifact.tar.gz to s3://my-bucket/builds/..."
        sleep 0.1
      done

      echo "--- Cleanup"
      echo "Removing temp files..."
      echo "Clearing build cache..."
      echo "Done."
