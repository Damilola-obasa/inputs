steps:
  - label: "Force ARG_MAX Error - Massive Environment"
    command: |
      echo "=== Forcing ARG_MAX error by creating massive environment ==="
      echo "Current ARG_MAX: $(getconf ARG_MAX)"
      echo "Initial environment size: $(env | wc -c) bytes"
      
      # Create a massive environment that will definitely exceed ARG_MAX
      echo "Creating massive environment variables..."
      
      # Create 200 variables of 10KB each = 2MB
      for i in {1..200}; do
        LARGE_VAR=$(printf 'VAR%.0s' {1..10000})
        export "MASSIVE_VAR_$i"="$LARGE_VAR"
      done
      
      # Create 100 variables of 20KB each = 2MB more
      for i in {1..100}; do
        HUGE_VAR=$(printf 'HUGE%.0s' {1..20000})
        export "HUGE_VAR_$i"="$HUGE_VAR"
      done
      
      # Create 50 variables of 50KB each = 2.5MB more
      for i in {1..50}; do
        MEGA_VAR=$(printf 'MEGA%.0s' {1..50000})
        export "MEGA_VAR_$i"="$MEGA_VAR"
      done
      
      # Create 20 variables of 100KB each = 2MB more
      for i in {1..20}; do
        GIGA_VAR=$(printf 'GIGA%.0s' {1..100000})
        export "GIGA_VAR_$i"="$GIGA_VAR"
      done
      
      # Create massive plugin configuration
      PLUGIN_CONFIG=$(printf 'PLUGIN%.0s' {1..500000})
      export BUILDKITE_PLUGINS="[{\"docker-compose#v4.0.0\":{\"config\":\"$PLUGIN_CONFIG\",\"services\":[\"app\",\"db\",\"redis\",\"worker\",\"nginx\",\"elasticsearch\",\"kibana\",\"prometheus\",\"grafana\",\"jaeger\",\"zipkin\",\"consul\",\"vault\",\"nomad\",\"traefik\",\"nginx-ingress\",\"cert-manager\",\"external-dns\",\"fluentd\",\"logstash\",\"filebeat\",\"metricbeat\",\"heartbeat\",\"auditbeat\",\"packetbeat\",\"winlogbeat\",\"functionbeat\",\"journalbeat\",\"osquerybeat\",\"uptimebeat\",\"syntheticsbeat\",\"apm-server\",\"kibana\",\"elasticsearch\",\"logstash\",\"beats\",\"x-pack\",\"security\",\"monitoring\",\"ml\",\"graph\",\"reporting\",\"canvas\",\"maps\",\"uptime\",\"apm\",\"infra\",\"logs\",\"metrics\",\"alerts\",\"cases\",\"siem\",\"endpoint\",\"fleet\",\"osquery\",\"timeline\",\"notebooks\",\"visualizations\",\"dashboards\",\"saved-objects\",\"index-patterns\",\"templates\",\"component-templates\",\"composable-templates\",\"data-streams\",\"indices\",\"aliases\",\"rollups\",\"transforms\",\"snapshot-lifecycle-management\",\"index-lifecycle-management\",\"watcher\",\"cross-cluster-replication\",\"cross-cluster-search\",\"remote-clusters\",\"ccr\",\"ccs\",\"remote-clusters\",\"cross-cluster-replication\",\"cross-cluster-search\"],\"watch\":[\"packages/app1/**/*\",\"packages/app2/**/*\",\"packages/app3/**/*\",\"packages/lib1/**/*\",\"packages/lib2/**/*\",\"packages/lib3/**/*\",\"packages/service1/**/*\",\"packages/service2/**/*\",\"packages/service3/**/*\",\"packages/ui/**/*\",\"packages/utils/**/*\",\"packages/shared/**/*\",\"packages/common/**/*\",\"packages/core/**/*\",\"packages/api/**/*\",\"packages/web/**/*\",\"packages/mobile/**/*\",\"packages/desktop/**/*\",\"packages/backend/**/*\",\"packages/frontend/**/*\",\"packages/database/**/*\",\"packages/cache/**/*\",\"packages/queue/**/*\",\"packages/worker/**/*\",\"packages/scheduler/**/*\",\"packages/notifier/**/*\",\"packages/analytics/**/*\",\"packages/monitoring/**/*\",\"packages/logging/**/*\",\"packages/auth/**/*\",\"packages/payment/**/*\",\"packages/email/**/*\",\"packages/sms/**/*\"]}}]"
      
      echo "Final environment size: $(env | wc -c) bytes"
      echo "ARG_MAX limit: $(getconf ARG_MAX) bytes"
      echo "BUILDKITE_PLUGINS size: $(echo -n "$BUILDKITE_PLUGINS" | wc -c) bytes"
      
      # This should definitely trigger the "argument list too long" error
      echo "Attempting to spawn process with massive environment..."
      /bin/bash -c "echo 'This should fail with argument list too long'"
      
      # Try multiple process spawns to increase chance of hitting the limit
      echo "Trying multiple process spawns..."
      for i in {1..10}; do
        echo "Spawn attempt $i"
        /bin/bash -c "echo 'Spawn attempt $i'"
      done