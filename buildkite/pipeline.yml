steps:
  - label: "Blocking Test A"
    key: "blocking-a"
    command: |
      echo "Running blocking test A..."
      sleep 5
      echo "Blocking test A done!"

  - label: "Blocking Test B"
    key: "blocking-b"
    command: |
      echo "Running blocking test B..."
      sleep 5
      echo "Blocking test B done!"

  - label: "Non-blocking slow test"
    key: "nonblocking-slow"
    command: |
      echo "Running non-blocking slow test..."
      sleep 120
      echo "Non-blocking test done!"
    soft_fail: true

  - label: "Cancel non-blocking tests"
    key: "cancel-nonblocking"
    command: |
      echo "Blocking tests done - cancelling non-blocking tests..."
      buildkite-agent step cancel --step nonblocking-slow --force --force-grace-period-seconds 10
      echo "Cancelled!"
    depends_on:
      - "blocking-a"
      - "blocking-b"
    allow_dependency_failure: true
