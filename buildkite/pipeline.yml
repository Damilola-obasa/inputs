          "file_name": "tests/payments_test.rb",
          "result": "failed",
          "failure_reason": "Timeout::Error: execution expired",
          "failure_expanded": [{ "expanded": ["Timeout::Error: execution expired\n  at tests/payments_test.rb:34"] }],
          "history": { "duration": 5.001, "start_at": 1700000006.0, "end_at": 1700000011.001 }
        },
        {
          "id": "test-007",
          "scope": "Payments",
          "name": "sends receipt email after payment",
          "location": "tests/payments_test.rb:45",
          "file_name": "tests/payments_test.rb",
          "result": "skipped",
          "failure_reason": null,
          "failure_expanded": [],
          "history": { "duration": 0.0, "start_at": 1700000012.0, "end_at": 1700000012.0 }
        },
        {
          "id": "test-008",
          "scope": "API",
          "name": "returns 200 for valid requests",
          "location": "tests/api_test.rb:8",
          "file_name": "tests/api_test.rb",
          "result": "passed",
          "failure_reason": null,
