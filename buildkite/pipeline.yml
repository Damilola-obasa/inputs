steps:
  - label: ":boom: ARG_MAX Error Test - Guaranteed Failure"
    key: "argmax_error_test"
    agents:
      queue: default
    command: |
      echo "=== ARG_MAX Error Test ==="
      echo "Current ARG_MAX: $(getconf ARG_MAX)"
      echo "Initial environment size: $(env | wc -c) bytes"
      
      # Create massive environment variables to exceed ARG_MAX
      echo "+++ Creating massive environment variables..."
      for i in {1..100}; do
        export "HUGE_VAR_$i"=$(python3 -c "print('X' * 10000)")
      done
      
      # Create massive BUILDKITE_PLUGINS
      echo "+++ Creating massive BUILDKITE_PLUGINS..."
      export BUILDKITE_PLUGINS="[{\"test-plugin#v1.0.0\":{\"config\":\"$(python3 -c "print('Y' * 500000)")\"}}]"
      
      echo "Environment size: $(env | wc -c) bytes"
      echo "BUILDKITE_PLUGINS size: $(echo -n "$BUILDKITE_PLUGINS" | wc -c) bytes"
      
      # This command will definitely exceed ARG_MAX
      echo "+++ Executing command that will fail with 'argument list too long'..."
      /bin/bash -c "echo 'This should fail with argument list too long: $(python3 -c \"print(\'Z\' * 500000)\")'"
      
      echo "❌ This should not be reached - ARG_MAX should have been exceeded"
    timeout_in_minutes: 5

  - label: ":boom: ARG_MAX Error Test - Extreme Case"
    key: "argmax_extreme_error"
    agents:
      queue: default
    command: |
      echo "=== ARG_MAX Extreme Error Test ==="
      echo "Current ARG_MAX: $(getconf ARG_MAX)"
      
      # Create extremely large environment variables
      echo "+++ Creating extremely large environment variables..."
      for i in {1..200}; do
        export "MEGA_VAR_$i"=$(python3 -c "print('MEGA_DATA_' * 5000)")
      done
      
      # Create massive plugin configuration
      echo "+++ Creating massive plugin configuration..."
      export BUILDKITE_PLUGINS="[{\"massive-plugin#v1.0.0\":{\"config\":\"$(python3 -c "print('PLUGIN_CONFIG_' * 100000)")\"}}]"
      
      # Add many more environment variables
      for i in {1..50}; do
        export "ENV_VAR_$i"=$(python3 -c "print('ENV_DATA_' * 20000)")
      done
      
      echo "Environment size: $(env | wc -c) bytes"
      echo "BUILDKITE_PLUGINS size: $(echo -n "$BUILDKITE_PLUGINS" | wc -c) bytes"
      
      # This will definitely exceed ARG_MAX
      echo "+++ Executing command that will definitely fail..."
      /bin/bash -c "echo 'Extreme test: $(python3 -c \"print(\'EXTREME_ARG_\' * 200000)\")'"
      
      echo "❌ This should not be reached - ARG_MAX should have been exceeded"
    timeout_in_minutes: 5

  - label: ":boom: ARG_MAX Error Test - Buildkite Agent Simulation"
    key: "argmax_agent_simulation"
    agents:
      queue: default
    command: |
      echo "=== ARG_MAX Buildkite Agent Simulation ==="
      echo "Current ARG_MAX: $(getconf ARG_MAX)"
      
      # Simulate real Buildkite environment with massive data
      export BUILDKITE_BUILD_ID="build-$(python3 -c "print('A' * 1000)")"
      export BUILDKITE_BRANCH="feature/$(python3 -c "print('B' * 1000)")"
      export BUILDKITE_COMMIT="$(python3 -c "print('C' * 1000)")"
      export BUILDKITE_MESSAGE="$(python3 -c "print('D' * 1000)")"
      
      # Create massive plugin configuration
      export BUILDKITE_PLUGINS="[{\"plugin1#v1.0.0\":{\"config\":\"$(python3 -c "print('E' * 200000)")\"}},{\"plugin2#v1.0.0\":{\"config\":\"$(python3 -c "print('F' * 200000)")\"}}]"
      
      # Add many environment variables
      for i in {1..100}; do
        export "BUILD_VAR_$i"=$(python3 -c "print('G' * 10000)")
      done
      
      echo "Environment size: $(env | wc -c) bytes"
      echo "BUILDKITE_PLUGINS size: $(echo -n "$BUILDKITE_PLUGINS" | wc -c) bytes"
      
      # This should trigger the exact error you want
      echo "+++ Executing command that will trigger 'fork/exec: argument list too long'..."
      /bin/bash -c "echo 'Buildkite simulation: $(python3 -c \"print(\'H\' * 300000)\")'"
      
      echo "❌ This should not be reached - ARG_MAX should have been exceeded"
    timeout_in_minutes: 5