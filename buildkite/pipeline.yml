steps:
  - label: "Create Artifacts"
    command: |
      mkdir -p apple
      echo "Hello" > apple/hello.txt
      echo "World" > apple/world.txt
      buildkite-agent artifact upload "apple/*.txt"

  - wait

  - label: "List All Artifacts (including retried jobs)"
    command: |
      echo "Listing all artifacts for this build (including retried jobs):"
      buildkite-agent artifact search "*" --include-retried-jobs