---
steps:
  # Test: Retry on agent_stop + none (should NOT retry on timeout if it's "cancel")
  - label: ":test_tube: Test: agent_stop + none"
    timeout_in_minutes: 1
    command: sleep 90
    retry:
      automatic:
        - exit_status: "*"
          signal_reason: "agent_stop"
          limit: 1
        - exit_status: "*"
          signal_reason: "none"
          limit: 1

  - wait: ~
    continue_on_failure: true

  - label: ":mag: Results"
    command: |
      buildkite-agent annotate "**Test Result:**
      If this job did NOT retry, then timeout signal_reason is 'cancel' (not 'none' as the blog suggests)" --style info
