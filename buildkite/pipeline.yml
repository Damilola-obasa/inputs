steps:
  - label: "Step A"
    command: |
      echo "Step A started at $(date -u +%T)"
      buildkite-agent pipeline upload <<'EOF'
      steps:
        - label: "Step B"
          depends_on: ~
          command: echo "Step B started at $(date -u +%T)"
      EOF
      echo "Step B uploaded, Step A continuing..."
      sleep 30
      echo "Step A finished at $(date -u +%T)"
