steps:
  - label: "Build"
    command: "echo 'Build completed'"

  - input: "⏸️ Blocked Step - Test Notification"
    prompt: "Click to continues - This will block the build for testing"

  - label: "Continue"
    command: "echo 'Pipeline continueded'"

notify:
  - slack: "#social"
    if: build.state == "blocked" 
