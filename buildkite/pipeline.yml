steps:
  - label: "Test Post-Checkout Hook Failure"
    command: |
      echo "Setting up a scenario to test post-checkout hook..."
      
      # First, do a normal checkout
      git checkout main
      
      # Now simulate a checkout failure by corrupting the repository
      echo "Simulating checkout failure by corrupting git state..."
      rm -f .git/HEAD
      
      # Try to checkout again - this should trigger the post-checkout hook
      git checkout main
      
      echo "If you see this, the post-checkout hook didn't catch the failure"

  - label: "Alternative Test - Direct Hook Execution"
    command: |
      echo "Testing post-checkout hook directly..."
      
      # Simulate a failed checkout exit code
      (exit 1)
      
      # Run the post-checkout hook manually
      echo "Running post-checkout hook with simulated failure..."
      bash hooks/post-checkout
      
      echo "Hook execution completed"