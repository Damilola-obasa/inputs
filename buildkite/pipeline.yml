steps:
  - label: "🔄 Flaky Test"
    key: "flaky-test-${BUILDKITE_BUILD_ID}"
    command: |
      echo "Running tests that will fail..."
      echo "❌ Test failed"
      exit 1
    retry:
      automatic:
        - exit_status: "*"
          limit: 5

  - label: "🔄 Another Flaky Test"
    key: "another-test-${BUILDKITE_BUILD_ID}"
    command: |
      echo "This step has the same key as the previous step"
      echo "This will cause a 422 error"
      exit 1
    retry:
      automatic:
        - exit_status: "*"
          limit: 3
