steps:
  - label: "Build"
    command: echo "Building on branch $BUILDKITE_BRANCH"

  - label: "Deploy to Staging"
    command: echo "Deploying to Staging"
    if: build.branch == "master"

  - label: "Deploy to QA"
    command: echo "Deploying to QA"
    if: build.branch == "master"

  - label: "Deploy to UAT"
    command: echo "Deploying to UAT"
    if: build.branch =~ /^release\//
