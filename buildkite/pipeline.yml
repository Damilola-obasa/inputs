steps:
  - label: "Case A: newline INSIDE quoted string (should NOT imply &&)"
    command: |
      echo "💡 Run reason
      yada yada serve_vllm"

  - label: "Case B: two separate commands (UI often joins with &&)"
    command: |
      echo "--- 💡 Run reason"
      echo "yada yada serve_vllm"

  - label: "Case C: printf (avoids embedding a literal newline in one arg)"
    command: |
      printf '%s\n' "💡 Run reason" "yada yada serve_vllm"

  - label: "Repro: literal \\n in echo string"
    command: |
      echo "💡 Run reason\nyada yada serve_vllm"

  # ============================================================
  # Skip reason tests — is the reason string visible in the UI?
  # ============================================================
  - label: "Skip with reason string"
    command: echo "This should not run"
    skip: "Component X hasn't changed, skipping build"

  - label: "Skip with boolean (no reason)"
    command: echo "This should not run either"
    skip: true

  - label: "This step runs normally"
    command: echo "I ran successfully"

  # ============================================================
  # Skip reason shown via annotation
  # ============================================================
  - label: ":memo: Announce skip reasons"
    command: |
      buildkite-agent annotate --style "info" --context "skip-reasons" <<'EOF'
      <h3>Skipped Steps</h3>
      <ul>
        <li><strong>Build Component X</strong> — Component X hasn't changed, skipping build</li>
        <li><strong>Deploy Staging</strong> — No deployment needed, config unchanged</li>
      </ul>
      EOF

  - label: "Build Component X"
    command: echo "This should not run"
    skip: "Component X hasn't changed, skipping build"

  - label: "Deploy Staging"
    command: echo "This should not run"
    skip: "No deployment needed, config unchanged"
