steps:
  - label: "Create Massive Plugin Configuration"
    command: |
      echo "=== Creating massive plugin configuration to trigger ARG_MAX ==="
      echo "Current ARG_MAX: $(getconf ARG_MAX)"
      echo "Initial environment size: $(env | wc -c) bytes"
      
      # Create a massive plugin configuration that will be serialized into BUILDKITE_PLUGINS
      # This simulates the exact scenario from the GitHub issue
      
      # Create very large plugin configuration JSON
      PLUGIN_CONFIG=$(printf 'X%.0s' {1..500000})
      
      # Create massive BUILDKITE_PLUGINS environment variable
      export BUILDKITE_PLUGINS="[{\"monorepo-diff#v1.5.1\":{\"watch\":["
      
      # Add 100 watch paths with large configurations
      for i in {1..100}; do
        WATCH_PATH="packages/app$i/**/*"
        COMMAND="echo 'Building app$i with very long command that includes many environment variables and complex build steps for package $i'"
        export BUILDKITE_PLUGINS="$BUILDKITE_PLUGINS{\"path\":\"$WATCH_PATH\",\"config\":{\"command\":\"$COMMAND\",\"label\":\"Build app$i\",\"env\":{\"PACKAGE_NAME\":\"app$i\",\"BUILD_CONFIG\":\"$PLUGIN_CONFIG\"}}},"
      done
      
      # Remove trailing comma and close the array
      export BUILDKITE_PLUGINS="${BUILDKITE_PLUGINS%,}]}]"
      
      echo "BUILDKITE_PLUGINS size: $(echo -n "$BUILDKITE_PLUGINS" | wc -c) bytes"
      echo "Total environment size: $(env | wc -c) bytes"
      
      # Now try to spawn a process that will definitely exceed ARG_MAX
      echo "Attempting to spawn process with massive plugin configuration..."
      
      # Create a command with the massive plugin config as an argument
      MASSIVE_CMD="echo 'Testing with massive plugin config: $BUILDKITE_PLUGINS'"
      
      # This should trigger the ARG_MAX error
      /bin/bash -c "$MASSIVE_CMD"

  - label: "Force ARG_MAX Error with Exec"
    command: |
      echo "=== Forcing ARG_MAX error with exec ==="
      
      # Create the largest possible environment
      for i in {1..1000}; do
        LARGE_VAR=$(printf 'VAR%.0s' {1..1000})
        export "ENV_VAR_$i"="$LARGE_VAR"
      done
      
      # Create massive plugin configuration
      PLUGIN_CONFIG=$(printf 'PLUGIN%.0s' {1..1000000})
      export BUILDKITE_PLUGINS="[{\"docker-compose#v4.0.0\":{\"config\":\"$PLUGIN_CONFIG\",\"services\":[\"app\",\"db\",\"redis\",\"worker\",\"nginx\",\"elasticsearch\",\"kibana\",\"prometheus\",\"grafana\",\"jaeger\",\"zipkin\",\"consul\",\"vault\",\"nomad\",\"traefik\",\"nginx-ingress\",\"cert-manager\",\"external-dns\",\"fluentd\",\"logstash\",\"filebeat\",\"metricbeat\",\"heartbeat\",\"auditbeat\",\"packetbeat\",\"winlogbeat\",\"functionbeat\",\"journalbeat\",\"osquerybeat\",\"uptimebeat\",\"syntheticsbeat\",\"apm-server\",\"kibana\",\"elasticsearch\",\"logstash\",\"beats\",\"x-pack\",\"security\",\"monitoring\",\"ml\",\"graph\",\"reporting\",\"canvas\",\"maps\",\"uptime\",\"apm\",\"infra\",\"logs\",\"metrics\",\"alerts\",\"cases\",\"siem\",\"endpoint\",\"fleet\",\"osquery\",\"timeline\",\"notebooks\",\"visualizations\",\"dashboards\",\"saved-objects\",\"index-patterns\",\"templates\",\"component-templates\",\"composable-templates\",\"data-streams\",\"indices\",\"aliases\",\"rollups\",\"transforms\",\"snapshot-lifecycle-management\",\"index-lifecycle-management\",\"watcher\",\"cross-cluster-replication\",\"cross-cluster-search\",\"remote-clusters\",\"ccr\",\"ccs\",\"remote-clusters\",\"cross-cluster-replication\",\"cross-cluster-search\"]}}]"
      
      echo "Environment size: $(env | wc -c) bytes"
      echo "ARG_MAX limit: $(getconf ARG_MAX) bytes"
      
      # Use exec to replace the current process - this should trigger ARG_MAX
      exec /bin/bash -c "echo 'This should fail with argument list too long'"

  - label: "Direct ARG_MAX Test"
    command: |
      echo "=== Direct ARG_MAX test ==="
      
      # Create a command with arguments that exceed ARG_MAX
      LONG_ARG=$(printf 'ARG%.0s' {1..1000000})
      
      echo "Long argument length: $(echo -n "$LONG_ARG" | wc -c) bytes"
      echo "ARG_MAX limit: $(getconf ARG_MAX) bytes"
      
      # Try to execute a command with the long argument
      echo "Attempting to execute command with long argument..."
      /bin/bash -c "echo 'Argument: $LONG_ARG'"
      
      # Try to use the long argument directly
      echo "Trying direct execution..."
      /bin/bash -c "echo '$LONG_ARG'"