steps:
  - label: "Run test suite and upload results"
    command: |
      echo "--- Generating test results"

      cat > test-results.json << 'EOF'
      [
        {
          "id": "test-001",
          "scope": "Authentication",
          "name": "logs in with valid credentials",
          "location": "tests/auth_test.rb:10",
          "file_name": "tests/auth_test.rb",
          "result": "passed",
          "failure_reason": null,
          "failure_expanded": [],
          "history": { "duration": 0.142, "start_at": 1700000000.0, "end_at": 1700000000.142 }
        },
        {
          "id": "test-002",
          "scope": "Authentication",
          "name": "rejects invalid credentials",
          "location": "tests/auth_test.rb:22",
          "file_name": "tests/auth_test.rb",
          "result": "passed",
          "failure_reason": null,
          "failure_expanded": [],
          "history": { "duration": 0.089, "start_at": 1700000001.0, "end_at": 1700000001.089 }
        },
        {
          "id": "test-003",
          "scope": "Authentication",
          "name": "handles expired session tokens",
          "location": "tests/auth_test.rb:35",
          "file_name": "tests/auth_test.rb",
          "result": "failed",
          "failure_reason": "Expected 401 but got 500",
          "failure_expanded": [{ "expanded": ["Expected: 401\n  Got: 500\n  at tests/auth_test.rb:38"] }],
          "history": { "duration": 0.203, "start_at": 1700000002.0, "end_at": 1700000002.203 }
        },
        {
          "id": "test-004",
          "scope": "Payments",
          "name": "processes a successful payment",
          "location": "tests/payments_test.rb:5",
          "file_name": "tests/payments_test.rb",
          "result": "passed",
          "failure_reason": null,
          "failure_expanded": [],
          "history": { "duration": 1.52, "start_at": 1700000003.0, "end_at": 1700000004.52 }
        },
        {
          "id": "test-005",
          "scope": "Payments",
          "name": "handles declined cards",
