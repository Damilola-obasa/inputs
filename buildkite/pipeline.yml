steps:
  - label: "Build 1"
    key: "build1"
    command: |
      echo "Starting Build 1..."
      sleep 120
      echo "Build 1 completed"
    concurrency_group: "my-builds"
    concurrency: 1

  - label: "Build 2 (waits for Build 1 to be cancelled)"
    key: "build2"
    command: |
      echo "Starting Build 2..."
      sleep 120
      echo "Build 2 completed"
    concurrency_group: "my-builds"
    concurrency: 1

  - label: "Build 3 (waits for Build 2 to be cancelled)"
    key: "build3"
    command: |
      echo "Starting Build 3..."
      sleep 120
      echo "Build 3 completed"
    concurrency_group: "my-builds"
    concurrency: 1