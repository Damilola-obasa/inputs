steps:
  - label: "Generate Name"
    command: |
      echo "Current directory: $(pwd)"
      echo "Script exists: $(ls -la ./buildkite/gen_name.sh)"
      echo "Script permissions: $(ls -la ./buildkite/gen_name.sh)"
      echo "Running script..."
      NAME=$(./buildkite/gen_name.sh)
      echo "Script exit code: $?"
      echo "Script output: '$NAME'"
      echo "Script output length: $(echo -n "$NAME" | wc -c)"
      if [ -z "$NAME" ]; then
        echo "Error: Script output is empty"
        exit 1
      fi
      buildkite-agent meta-data set "generated-name" "$NAME"
    
  - label: "Deploy"
    trigger: "deploy-pipeline"
    build:
      env:
        DEPLOY_TARGET_NAME: ${BUILDKITE_META_DATA_generated-name}