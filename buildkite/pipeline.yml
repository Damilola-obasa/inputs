env:
  JOB_TYPE: "default"

steps:
  - command: |
      if [ -z "${JOB_TYPE:-}" ]; then
        echo "Error: JOB_TYPE environment variable is required"
        echo "Set it when triggering the build (e.g., JOB_TYPE=data-processing)"
        exit 1
      fi
      LIMIT=$(jq -r --arg type "$JOB_TYPE" '.[$type] // .default' buildkite/concurrency-config.json)
      cat <<EOF | buildkite-agent pipeline upload
      steps:
        - label: ":runner: Runner - ${JOB_TYPE}"
          command: "upload-jobs.sh"
          concurrency_group: "runner/\${BUILDKITE_BUILD_CREATOR}/${JOB_TYPE}"
          concurrency: ${LIMIT}

        - label: ":test_tube: Test Job 1 - ${JOB_TYPE}"
          command: |
            echo "Job 1 starting..."
            sleep 10
            echo "Job 1 completed"
          concurrency_group: "runner/\${BUILDKITE_BUILD_CREATOR}/${JOB_TYPE}"
          concurrency: ${LIMIT}

        - label: ":test_tube: Test Job 2 - ${JOB_TYPE}"
          command: |
            echo "Job 2 starting..."
            sleep 10
            echo "Job 2 completed"
          concurrency_group: "runner/\${BUILDKITE_BUILD_CREATOR}/${JOB_TYPE}"
          concurrency: ${LIMIT}

        - label: ":test_tube: Test Job 3 - ${JOB_TYPE}"
          command: |
            echo "Job 3 starting..."
            sleep 10
            echo "Job 3 completed"
          concurrency_group: "runner/\${BUILDKITE_BUILD_CREATOR}/${JOB_TYPE}"
          concurrency: ${LIMIT}

        - label: ":test_tube: Test Job 4 - ${JOB_TYPE}"
          command: |
            echo "Job 4 starting..."
            sleep 10
            echo "Job 4 completed"
          concurrency_group: "runner/\${BUILDKITE_BUILD_CREATOR}/${JOB_TYPE}"
          concurrency: ${LIMIT}

        - label: ":test_tube: Test Job 5 - ${JOB_TYPE}"
          command: |
            echo "Job 5 starting..."
            sleep 10
            echo "Job 5 completed"
          concurrency_group: "runner/\${BUILDKITE_BUILD_CREATOR}/${JOB_TYPE}"
          concurrency: ${LIMIT}
      EOF
