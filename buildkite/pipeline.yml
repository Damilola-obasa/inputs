steps:
  - label: ":test_tube: Control step"
    key: "control-step"
    command: |
      echo "plain output only"
      sleep 20
      echo "done"

  - label: ":test_tube: Decorated step"
    key: "decorated-step"
    command: |
      echo "starting"
      sleep 5
      echo "✓ test 1"
      sleep 5
      echo "✓ test 2"
      sleep 5
      echo "✗ test s3"
      sleep 5
      echo "done"