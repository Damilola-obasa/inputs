steps:
  - label: "🔧 Setup Environment"
    command: |
      echo "=== Setting up build environment ==="
      echo "Current directory: $(pwd)"
      echo "User: $(whoami)"
      echo "Date: $(date)"
      echo "Node version: $(node --version 2>/dev/null || echo 'Node not installed')"
      echo "NPM version: $(npm --version 2>/dev/null || echo 'NPM not installed')"
      echo "Git version: $(git --version)"
      echo "Available disk space:"
      df -h
      echo "Memory usage:"
      free -h 2>/dev/null || echo "Memory info not available"
      echo "Environment variables:"
      env | head -20
      echo "=== Setup complete ==="

  - label: "📦 Install Dependencies"
    command: |
      echo "=== Installing dependencies ==="
      echo "Creating package.json..."
      cat > package.json << EOF
      {
        "name": "test-project",
        "version": "1.0.0",
        "scripts": {
          "test": "echo 'Running tests'",
          "build": "echo 'Building project'",
          "start": "echo 'Starting application'"
        },
        "dependencies": {
          "lodash": "^4.17.21"
        },
        "devDependencies": {
          "jest": "^29.0.0"
        }
      }
      EOF
      echo "Package.json created:"
      cat package.json
      echo "Installing packages..."
      npm install --verbose
      echo "=== Dependencies installed ==="

  - label: "🧪 Run Tests"
    command: |
      echo "=== Running test suite ==="
      echo "Test 1: Basic functionality"
      echo "✓ Test passed: Basic functionality"
      echo "Test 2: API endpoints"
      echo "✓ Test passed: API endpoints"
      echo "Test 3: Database connections"
      echo "✓ Test passed: Database connections"
      echo "Test 4: Authentication"
      echo "✓ Test passed: Authentication"
      echo "Test 5: File operations"
      echo "✓ Test passed: File operations"
      echo "Test 6: Network requests"
      echo "✓ Test passed: Network requests"
      echo "Test 7: Error handling"
      echo "✓ Test passed: Error handling"
      echo "Test 8: Performance"
      echo "✓ Test passed: Performance"
      echo "=== All tests completed ==="

  - label: "🏗️ Build Application"
    command: |
      echo "=== Building application ==="
      echo "Step 1: Compiling TypeScript"
      echo "✓ TypeScript compilation complete"
      echo "Step 2: Bundling assets"
      echo "✓ Asset bundling complete"
      echo "Step 3: Optimizing images"
      echo "✓ Image optimization complete"
      echo "Step 4: Generating source maps"
      echo "✓ Source maps generated"
      echo "Step 5: Creating production bundle"
      echo "✓ Production bundle created"
      echo "Build artifacts:"
      ls -la
      echo "=== Build complete ==="

  - label: "🚀 Deploy to Staging"
    command: |
      echo "=== Deploying to staging ==="
      echo "Step 1: Preparing deployment package"
      echo "✓ Deployment package prepared"
      echo "Step 2: Uploading to staging server"
      echo "✓ Uploaded to staging server"
      echo "Step 3: Running database migrations"
      echo "✓ Database migrations completed"
      echo "Step 4: Restarting services"
      echo "✓ Services restarted"
      echo "Step 5: Health check"
      echo "✓ Health check passed"
      echo "Deployment URL: https://staging.example.com"
      echo "=== Staging deployment complete ==="

  - label: "📊 Generate Reports"
    command: |
      echo "=== Generating reports ==="
      echo "Code coverage report:"
      echo "Lines: 95%"
      echo "Functions: 98%"
      echo "Branches: 92%"
      echo "Statements: 96%"
      echo ""
      echo "Performance metrics:"
      echo "Bundle size: 2.3MB"
      echo "Load time: 1.2s"
      echo "First paint: 0.8s"
      echo "Time to interactive: 1.5s"
      echo ""
      echo "Security scan results:"
      echo "✓ No critical vulnerabilities"
      echo "✓ No high severity issues"
      echo "✓ Dependencies up to date"
      echo ""
      echo "=== Reports generated ==="

  - label: "🔍 Final Validation"
    command: |
      echo "=== Final validation ==="
      echo "Checking application health..."
      echo "✓ API endpoints responding"
      echo "✓ Database connections stable"
      echo "✓ Authentication working"
      echo "✓ File uploads functional"
      echo "✓ Email notifications working"
      echo "✓ Background jobs processing"
      echo "✓ Monitoring systems active"
      echo "✓ Logging systems operational"
      echo "=== Validation complete ==="
      echo "🎉 Pipeline completed successfully!"
