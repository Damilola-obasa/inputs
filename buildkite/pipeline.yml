---
steps:
  # This job will run but timeout during execution
  - label: ":test: Job That Will Timeout"
    timeout_in_minutes: 1
    command: |
      echo "Sleeping for 2 minutes to trigger timeout"
      sleep 120
    
  - wait: ~
    continue_on_failure: true

  - label: ":test: Check for Timeouts"
    command: |
      curl -s -H "Authorization: Bearer $$BUILDKITE_API_TOKEN" \
        "https://api.buildkite.com/v2/organizations/$$BUILDKITE_ORGANIZATION_SLUG/pipelines/$$BUILDKITE_PIPELINE_SLUG/builds/$$BUILDKITE_BUILD_NUMBER" \
        | jq -r '.jobs[] | select(.state == "timed_out") | .name' \
        | while read job; do
            buildkite-agent annotate ":x: Job timed out: $$job" --style error
          done
