          watch:
            - "packages/app1/**/*"
            - "packages/app2/**/*"
            - "packages/app3/**/*"
            - "packages/app4/**/*"
            - "packages/app5/**/*"
            - "packages/lib1/**/*"
            - "packages/lib2/**/*"
            - "packages/lib3/**/*"
            - "packages/lib4/**/*"
            - "packages/lib5/**/*"
            - "packages/service1/**/*"
            - "packages/service2/**/*"
            - "packages/service3/**/*"
            - "packages/service4/**/*"
            - "packages/service5/**/*"
            - "packages/ui/**/*"
            - "packages/utils/**/*"
            - "packages/shared/**/*"
            - "packages/common/**/*"
            - "packages/core/**/*"
            - "packages/api/**/*"
            - "packages/web/**/*"
            - "packages/mobile/**/*"
            - "packages/desktop/**/*"
            - "packages/backend/**/*"
            - "packages/frontend/**/*"
            - "packages/database/**/*"
            - "packages/cache/**/*"
            - "packages/queue/**/*"
            - "packages/worker/**/*"
            - "packages/scheduler/**/*"
            - "packages/notifier/**/*"
            - "packages/analytics/**/*"
            - "packages/monitoring/**/*"
            - "packages/logging/**/*"
            - "packages/auth/**/*"
            - "packages/payment/**/*"
            - "packages/email/**/*"
            - "packages/sms/**/*"
      - github.com/buildkite-plugins/docker-compose#v4.0.0:
          config: docker-compose.yml
          services: [app, db, redis, worker, nginx, elasticsearch, kibana, prometheus, grafana]
          watch: [src/**/*, tests/**/*, docs/**/*, config/**/*, scripts/**/*, tools/**/*]
          environment: [NODE_ENV=test, DATABASE_URL=postgres://localhost/test, REDIS_URL=redis://localhost:6379]
      - github.com/buildkite-plugins/ecr#v2.0.0:
          account-ids: [123456789012, 234567890123, 345678901234, 456789012345, 567890123456]
          login: true
          config: ecr-config.json
      - github.com/buildkite-plugins/s3-secrets#v2.0.0:
          secrets: [database-password, api-key, jwt-secret, encryption-key, ssl-cert]
          config: s3-secrets-config.json
      - github.com/buildkite-plugins/artifacts#v1.0.0:
          upload: [build/**/*, dist/**/*, coverage/**/*, reports/**/*]
          download: [build/**/*, dist/**/*]
          config: artifacts-config.json
    command: |
      echo "=== Reproducing ARG_MAX issue as described in GitHub issue #3509 ==="
      echo "Current ARG_MAX: $(getconf ARG_MAX)"
      echo "Current environment size: $(env | wc -c) bytes"
      echo "BUILDKITE_PLUGINS size: $(echo -n "$BUILDKITE_PLUGINS" | wc -c) bytes"
      
      # This step has 30+ watch configurations in monorepo-diff plugin
      # Multiple plugins per step (4-5 plugins with configurations)
      # Long inline commands (20+ lines of bash)
      # Conditional steps that trigger on merge queue branches
      
      echo "Step 1: Setting up environment variables"
      echo "Step 2: Installing dependencies"
      echo "Step 3: Running tests"
      echo "Step 4: Building application"
      echo "Step 5: Running linting"
      echo "Step 6: Running security scans"
      echo "Step 7: Generating documentation"
      echo "Step 8: Creating artifacts"
      echo "Step 9: Uploading to staging"
      echo "Step 10: Running integration tests"
      echo "Step 11: Performance testing"
      echo "Step 12: Security testing"
      echo "Step 13: Accessibility testing"
      echo "Step 14: Browser testing"
      echo "Step 15: Mobile testing"
      echo "Step 16: API testing"
      echo "Step 17: Database testing"
      echo "Step 18: Cache testing"
      echo "Step 19: Queue testing"
      echo "Step 20: Final validation"
      
      # Simulate the exact failure scenario
      echo "Attempting to spawn process with large environment..."
      /bin/bash -c "echo 'This should fail with argument list too long'"

