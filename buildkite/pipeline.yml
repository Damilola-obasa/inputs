# Recommended (server-selected) github-actions plugin form.
# No key, no version pin, no explicit workflow — Buildkite selects workflows
# from .github/workflows/ based on the triggering event. This mode does NOT
# require BUILDKITE_STEP_KEY, so it avoids the earlier error entirely.
steps:
  - label: ":github: GitHub Actions"
    plugins:
      - github-actions
