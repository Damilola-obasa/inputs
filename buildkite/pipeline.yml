    steps:
      - label: "Build frontend"
        command: "echo 'Building frontend'"
      - label: "Test frontend"
        command: "echo 'Testing frontend'"
      - label: "Lint frontend"
        command: "echo 'Linting frontend'"

  - group: "Backend"
