steps:
  - input: "Deploy To"
    key: "deploy-input"
    fields:
      - select: "Regions"
        key: "deploy-regions"
        hint: "Which regions should we deploy this to? :earth_asia:"
        required: true
        multiple: true
        default:
          - "na"
          - "eur"
          - "asia"
          - "aunz"
        options:
          - label: "North America"
            value: "na"
          - label: "Europe"
            value: "eur"
          - label: "Asia"
            value: "asia"
          - label: "Oceania"
            value: "aunz"

  - label: ":mag: Show metadata"
    depends_on: "deploy-input"
    command: |
      set -euo pipefail
      VAL="$(buildkite-agent meta-data get 'deploy-regions')"
      echo "deploy-regions: $VAL"
      echo "as lines:"
      printf '%s' "$VAL" | tr ',' '\n'