  - label: "Test Process Spawning with Large Environment"
    command: |
      echo "=== Testing process spawning with large environment ==="
      
      # Create massive environment variables that exceed ARG_MAX (1MB)
      export MASSIVE_VAR_1="$(printf 'A%.0s' {1..200000})"
      export MASSIVE_VAR_2="$(printf 'B%.0s' {1..200000})"
      export MASSIVE_VAR_3="$(printf 'C%.0s' {1..200000})"
      export MASSIVE_VAR_4="$(printf 'D%.0s' {1..200000})"
      export MASSIVE_VAR_5="$(printf 'E%.0s' {1..200000})"
      
      # Create large plugin configuration
      PLUGIN_CONFIG_1=$(printf 'X%.0s' {1..50000})
      PLUGIN_CONFIG_2=$(printf 'Y%.0s' {1..50000})
      PLUGIN_CONFIG_3=$(printf 'Z%.0s' {1..50000})
      
      export BUILDKITE_PLUGINS="[{\"github.com/buildkite-plugins/docker-compose#v4.0.0\":{\"config\":\"$PLUGIN_CONFIG_1\",\"services\":[\"app\",\"db\",\"redis\",\"worker\",\"nginx\",\"elasticsearch\"],\"watch\":[\"src/**/*\",\"tests/**/*\",\"docs/**/*\",\"config/**/*\",\"scripts/**/*\",\"tools/**/*\"]}},{\"github.com/buildkite-plugins/ecr#v2.0.0\":{\"account-ids\":[\"123456789012\",\"234567890123\",\"345678901234\",\"456789012345\"],\"login\":true,\"config\":\"$PLUGIN_CONFIG_2\"}},{\"github.com/buildkite-plugins/s3-secrets#v2.0.0\":{\"secrets\":[\"$PLUGIN_CONFIG_3\"],\"config\":\"$PLUGIN_CONFIG_3\"}}]"
      
      # Add even more large environment variables to exceed ARG_MAX
      for i in {1..10}; do
        HUGE_VAR=$(printf 'HUGE%.0s' {1..100000})
        export "EXTRA_LARGE_VAR_$i"="$HUGE_VAR"
      done
      
      echo "Total environment size: $(env | wc -c) bytes"
      echo "ARG_MAX limit: $(getconf ARG_MAX) bytes"
      
      # This should trigger the "argument list too long" error
      echo "Attempting to spawn process with large environment..."
      /bin/bash -c "echo 'This should fail with argument list too long'"

  - label: "Simulate Merge Queue Branch Name Issue"
    command: |
      echo "=== Simulating merge queue branch name issue ==="
      
      # Create a very long branch name (like GitHub merge queue)
      export BUILDKITE_BRANCH="gh-readonly-queue/main/pr-12345-abcdef1234567890abcdef1234567890abcdef12"
      export BUILDKITE_MESSAGE="Merge pull request #12345 from feature-branch-abcdef1234567890abcdef1234567890abcdef12"
      
      # Create large plugin configuration
      PLUGIN_CONFIG=$(printf 'CONFIG%.0s' {1..20000})
      export BUILDKITE_PLUGINS="[{\"github.com/buildkite-plugins/monorepo-diff#v1.0.0\":{\"watch\":[\"packages/app1/**/*\",\"packages/app2/**/*\",\"packages/app3/**/*\",\"packages/lib1/**/*\",\"packages/lib2/**/*\",\"packages/lib3/**/*\",\"packages/service1/**/*\",\"packages/service2/**/*\",\"packages/service3/**/*\"],\"config\":\"$PLUGIN_CONFIG\"}}]"
      
      # Add many environment variables
      for i in {1..50}; do
        VAR_CONTENT=$(printf 'VAR%.0s' {1..5000})
        export "ENV_VAR_$i"="$VAR_CONTENT"
      done
      
      echo "Environment size: $(env | wc -c) bytes"
      echo "Branch name: $BUILDKITE_BRANCH"
      echo "Message: $BUILDKITE_MESSAGE"
      
      # Try to spawn process
      /bin/bash -c "echo 'Process spawn test'"
