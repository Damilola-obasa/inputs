steps:
  # Fast steps that should fail fast
  - label: "Go Linter"
    command: "echo 'Linting passed' && exit 0"
    timeout_in_minutes: 5
    key: "fast-linter"
    
  - label: "Go Test (Fast)"
    command: "echo 'Fast tests passed' && exit 0"
    timeout_in_minutes: 5
    key: "fast-tests"

  # Wait for fast steps to complete before starting slow steps
  - wait

  # Slow steps that run in parallel (only if fast steps passed)
  - label: "Integration Tests"
    command: "go test -v ./integration/..."
    timeout_in_minutes: 20
    depends_on: ["fast-linter", "fast-tests"]
    
  - label: "E2E Tests"
    command: "go test -v ./e2e/..."
    timeout_in_minutes: 20
    depends_on: ["fast-linter", "fast-tests"]
    
  - label: "Security Scan"
    command: "gosec ./..."
    timeout_in_minutes: 15
    depends_on: ["fast-linter", "fast-tests"]
    
  - label: "Performance Tests"
    command: "go test -bench=. ./perf/..."
    timeout_in_minutes: 25
    depends_on: ["fast-linter", "fast-tests"]
    
  - label: "Code Coverage"
    command: "go test -coverprofile=coverage.out ./... && go tool cover -html=coverage.out"
    timeout_in_minutes: 15
    depends_on: ["fast-linter", "fast-tests"]
    
  - label: "Build Docker Images"
    command: "docker build -t app:latest ."
    timeout_in_minutes: 10
    depends_on: ["fast-linter", "fast-tests"]
    
  - label: "Database Migration Tests"
    command: "go test -v ./migrations/..."
    timeout_in_minutes: 12
    depends_on: ["fast-linter", "fast-tests"]
    
  - label: "API Documentation"
    command: "swagger generate spec -o swagger.json"
    timeout_in_minutes: 8
    depends_on: ["fast-linter", "fast-tests"]
    
  - label: "Static Analysis"
    command: "staticcheck ./..."
    timeout_in_minutes: 10
    depends_on: ["fast-linter", "fast-tests"]
    
  - label: "Dependency Check"
    command: "go mod verify && go list -u -m all"
    timeout_in_minutes: 5
    depends_on: ["fast-linter", "fast-tests"]
