steps:
  - label: "Generate Name"
    command: |
      echo "Setting hardcoded metadata..."
      buildkite-agent meta-data set "generated-name" "micheal"
      echo "Metadata set. Retrieving to verify..."
      RETRIEVED=$(buildkite-agent meta-data get "generated-name")
      echo "Retrieved metadata: $RETRIEVED"
    
  - label: "Deploy"
    trigger: "deploy-pipeline"
    build:
      env:
        DEPLOY_TARGET_NAME: $BUILDKITE_META_DATA_generated-name