---
steps:
  # This job will run but timeout during execution
  - label: ":test_tube: Job That Will Timeout"
    timeout_in_minutes: 1
    command: |
      echo "Starting job..."
      echo "Sleeping for 2 minutes to trigger timeout..."
      sleep 120
      echo "This won't print"

  - wait: ~
    continue_on_failure: true

  - label: ":hourglass: Check for Timeouts"
    command: |
      RESPONSE=$$(curl -s -H "Authorization: Bearer $$BUILDKITE_API_TOKEN" \
        "https://api.buildkite.com/v2/organizations/$$BUILDKITE_ORGANIZATION_SLUG/pipelines/$$BUILDKITE_PIPELINE_SLUG/builds/$$BUILDKITE_BUILD_NUMBER")

      echo "--- Checking for timed out jobs"
      TIMED_OUT=$$(echo "$$RESPONSE" | jq -r '.jobs[] | select(.state == "timed_out") | .name')

      if [ -n "$$TIMED_OUT" ]; then
        echo "Found timed out job(s)!"
        echo "$$TIMED_OUT" | while read job; do
          buildkite-agent annotate ":x: Job timed out: $$job" --style error
        done
      else
        echo "No timed out jobs found"
      fi
