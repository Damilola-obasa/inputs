steps:
  - label: "Check for build.log"
    command: |
      echo "Current directory: $(pwd)"
      ls -l build.log  # List the file to see if it exists

steps:
  - command: build.sh
    artifact_paths: "build.log"
    
steps:
  - command: buildkite-agent artifact upload “build.log” 
    artifact_paths: "build.log"



