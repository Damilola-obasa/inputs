steps:
  - label: "Case A: newline INSIDE quoted string (should NOT imply &&)"
    command: |
      echo "💡 Run reason
      yada yada serve_vllm"

  - label: "Case B: two separate commands (UI often joins with &&)"
    command: |
      echo "--- 💡 Run reason"
      echo "yada yada serve_vllm"

  - label: "Case C: printf (avoids embedding a literal newline in one arg)"
    command: |
      printf '%s\n' "💡 Run reason" "yada yada serve_vllm"

  - label: "Repro: literal \\n in echo string"
    command: |
      echo "💡 Run reason\nyada yada serve_vllm"
