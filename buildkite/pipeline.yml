steps:
  - label: "Bootstrap: Generate Dynamic Pipeline"
    key: "bootstrap"
    command: |
      set -euo pipefail
      
      # Check if JOB_TYPE is set
      if [ -z "${JOB_TYPE:-}" ]; then
        echo "Error: JOB_TYPE environment variable is required"
        exit 1
      fi
      
      # Read concurrency limit from config
      CONFIG_FILE="buildkite/concurrency-config.json"
      
      if [ ! -f "$CONFIG_FILE" ]; then
        echo "Error: Config file $CONFIG_FILE not found"
        exit 1
      fi
      
      # Extract concurrency limit for the job type, fallback to default if not found
      CONCURRENCY_LIMIT=$(jq -r --arg job_type "$JOB_TYPE" '.[$job_type] // .default' "$CONFIG_FILE")
      
      if [ "$CONCURRENCY_LIMIT" = "null" ] || [ -z "$CONCURRENCY_LIMIT" ]; then
        echo "Error: No concurrency limit found for job type '$JOB_TYPE' and no default specified"
        exit 1
      fi
      
      echo "Job Type: $JOB_TYPE"
      echo "Concurrency Limit: $CONCURRENCY_LIMIT"
      echo "Build Creator: ${BUILDKITE_BUILD_CREATOR:-unknown}"
      
      # Generate the dynamic pipeline (YAML must start at column 0)
      DYNAMIC_PIPELINE=$(cat <<EOF
steps:
  - label: "runner"
    command: "upload-jobs.sh"
    concurrency_group: "runner/\${BUILDKITE_BUILD_CREATOR}/${JOB_TYPE}"
    concurrency: ${CONCURRENCY_LIMIT}
EOF
      )
      
      # Write to a temporary file and upload
      echo "$DYNAMIC_PIPELINE" | buildkite-agent pipeline upload
      
      echo "Dynamic pipeline uploaded successfully"
