steps:
  - label: "Generate and Deploy"
    command: |
      ./buildkite/gen_name.sh
      echo "=== Captur ng script output to file ==="
      ./buildkite/gen_name.sh > output.txt
      echo "=== File content ==="
      cat output.txt
      echo "=== Reading from file ==="
      NAME=$(cat output.txt)
      echo "NAME: '$NAME'"
      echo "=== Script output: $NAME ==="
      
  - label: "Deploy"
    trigger: "deploy-pipeline"
    build:
      env:
        DEPLOY_TARGET_NAME: $NAME