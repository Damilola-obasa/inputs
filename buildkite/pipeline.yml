steps:
  - label: "Set environment and upload dynamic pipeline"
    command: ./buildkite/generate-pipeline.sh

  - label: "Run in Dockers"
    plugins:
      - docker#v5.10.0:
          image: "alpine:3.19"
          command: ["sh", "-c", "echo MY_DYNAMIC_VAR is $MY_DYNAMIC_VAR, ANOTHER_VAR is $ANOTHER_VAR"]
          env-file: buildkite/.env
