steps:
  - label: "Guard"
    key: "guard"
    command: |
      echo "BUILDKITE_SOURCE=$BUILDKITE_SOURCE"
      echo "BUILDKITE_RETRY_COUNT=$BUILDKITE_RETRY_COUNT"
      if [ "$BUILDKITE_SOURCE" = "ui" ] && [ "$BUILDKITE_RETRY_COUNT" -eq 0 ]; then
        echo "Manual build detected — blocking"
        exit 1
      fi
      echo "Build allowed to continue"

  - label: "Actual work"
    command: echo "Running actual job"
    depends_on: "guard"
