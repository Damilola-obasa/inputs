steps:
  - label: "Uploader"
    command: |
      echo "Uploading Step A (depends on Step B) at $(date -u +%T)"
      buildkite-agent pipeline upload <<'EOF'
      steps:
        - label: "Step A"
          key: "step-a"
          depends_on: "step-b"
          command: echo "Step A ran at $(date -u +%T)"
      EOF
      echo "Step A uploaded — Step B will never be uploaded"
      echo "Uploader finished at $(date -u +%T)"
