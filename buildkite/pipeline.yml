steps:
  - label: "🚀 Build"
    command: "echo 'Build completed'"

  - input: "⏸️ Blocked Step - Test Notification"
    prompt: "Click to continue - This will block the build for testing"

  - label: "✅ Continue"
    command: "echo 'Pipeline continued'"

notify:
  - slack: "#social"
    if: build.state == "blocked"
    message: "<@micheal-obasa> Build is blocked and waiting for approval"