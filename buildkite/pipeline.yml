# Simple pipeline to verify PR activity triggers a build and runs green.
# No plugins, no GitHub Actions import — just confirms triggering end-to-end.
steps:
  - label: ":wave: Simple PR trigger test"
    command: |
      echo "--- Build triggered"
      echo "PR number : $$BUILDKITE_PULL_REQUEST"
      echo "Branch    : $$BUILDKITE_BRANCH"
      echo "Commit    : $$BUILDKITE_COMMIT"
      echo "Source    : $$BUILDKITE_SOURCE"
      echo "This confirms PR activity triggers a build and the agent runs it to green."
