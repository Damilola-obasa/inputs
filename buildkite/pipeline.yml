steps:
  - block: "Select Environment"
    fields:
      - select: "Choose deployment target"
        key: "environment"
        default: "production"
        options:
          - label: "Staging"
            value: "s"
          - label: "Production"
            value: "p"
          - label: "Development"
            value: "d"
          - label: "Testing"
            value: "t"

  - command: "deploy.sh"
    env:
      DEPLOY_ENV: "$(buildkite-agent meta-data get environment)"
