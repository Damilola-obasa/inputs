---
steps:
  - label: ":label: Set Metadata"
    command: |
      buildkite-agent meta-data set "env" "production"
      buildkite-agent meta-data set "version" "1.2.3"

  - label: ":memo: Display Metadata"
    command: |
      {
        echo "## Metadata"
        echo ""
        for key in $$(buildkite-agent meta-data keys); do
          VALUE=$$(buildkite-agent meta-data get "$$key")
          echo "**$$key:** \`$$VALUE\`"
        done
      } | buildkite-agent annotate --style info

  - label: ":wave: Simple Annotation"
    command: |
      buildkite-agent annotate "Hello! This is a simple test annotation." --style success
