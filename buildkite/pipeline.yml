steps:
  - label: ":boom: Upstream step (intentionally fails)"
    key: "upstream"
    command: "exit 1"

  - group: ":family: Group depending on failed upstream"
    key: "group"
    depends_on: "upstream"
    steps:
      - label: "Child job A"
        key: "child-a"
        command: "echo 'child A ran'"
      - label: "Child job B"
        key: "child-b"
        command: "echo 'child B ran'"

  - label: ":mag: Downstream inspection step (workaround: check upstream, not group)"
    key: "inspect"
    depends_on: "upstream"
    allow_dependency_failure: true
    command: |
      echo "--- Downstream step is runnable (this line printing confirms it)"

      echo "--- Workaround: checking the real source step ('upstream') instead of the group key"
      buildkite-agent step get state --step "upstream" || echo "(state lookup failed)"
      buildkite-agent step get outcome --step "upstream" || echo "(outcome lookup failed)"

      echo "--- For comparison: group state / outcome (the known-stuck key, kept for reference)"
      buildkite-agent step get state --step "group" || echo "(state lookup failed)"
      buildkite-agent step get outcome --step "group" || echo "(outcome lookup failed)"
