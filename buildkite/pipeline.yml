---
steps:
  # Test 1: Retry on agent_stop only (should NOT retry on timeout)
  - label: ":test_tube: Test 1: agent_stop only"
    timeout_in_minutes: 1
    command: sleep 120
    retry:
      automatic:
        - exit_status: "*"
          signal_reason: "agent_stop"
          limit: 2

  # Test 2: Don't retry on cancelled (should NOT retry on timeout if signal is cancelled)
  - label: ":test_tube: Test 2: exclude cancelled"
    timeout_in_minutes: 1
    command: sleep 120
    retry:
      automatic:
        - exit_status: "*"
          signal_reason: "none"
          limit: 2

  # Test 3: Retry on cancel (should retry on timeout if signal IS cancel)
  - label: ":test_tube: Test 3: retry cancel"
    timeout_in_minutes: 1
    command: sleep 120
    retry:
      automatic:
        - exit_status: "*"
          signal_reason: "cancel"
          limit: 2

  - wait: ~
    continue_on_failure: true

  - label: ":mag: Results"
    command: |
      buildkite-agent annotate "**Test Results:**
      - Test 1 (agent_stop): Should NOT retry
      - Test 2 (none): Should NOT retry
      - Test 3 (cancel): Should RETRY (timeout signal is 'cancel')" --style info
