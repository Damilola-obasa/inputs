steps:
  - label: "🚀 Deploy Stage"
    key: "deploy-stage-${BUILDKITE_BUILD_NUMBER}"
    command: |
      echo "Starting deploy stage..."
      echo "This stage will retry on failure and generate another stage"
      ./buildkite/generate-test-stage.sh
    retry:
      automatic:
        - exit_status: "*"
          limit: 3