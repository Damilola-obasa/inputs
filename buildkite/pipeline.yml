steps:
  - group: "🚀 Build Phase"
    steps:
      - label: "📦 Install Dependencies"
        command: |
          echo "Installing dependencies..."
          sleep 2
          echo "✅ Dependencies installed"

      - label: "🔨 Build Application"
        command: |
          echo "Building application..."
          sleep 3
          echo "✅ Build completed"

  - group: "🧪 Test Phase"
    steps:
      - label: "🔍 Unit Tests"
        command: |
          echo "Running unit tests..."
          sleep 2
          echo "✅ Unit tests passed"

      - label: "🔍 Integration Tests"
        command: |
          echo "Running integration tests..."
          sleep 2
          echo "✅ Integration tests passed"

      - label: "❌ Hard Failed Test"
        command: |
          echo "Running critical test that will fail..."
          sleep 1
          echo "❌ Critical test failed!"
          exit 1

  - group: "📊 Analysis Phase"
    steps:
      - label: "📈 Code Coverage"
        command: |
          echo "Checking code coverage..."
          sleep 1
          echo "✅ Coverage: 85%"

      - label: "🔍 Security Scan"
        command: |
          echo "Running security scan..."
          sleep 2
          echo "✅ Security scan passed"

  - label: "📱 Check Step Outcomes"
    command: |
      echo "Checking step outcomes..."
      
      # Check if any steps failed
      if buildkite-agent step get "outcome" --step "❌ Hard Failed Test" | grep -q "failed"; then
        echo "❌ Hard Failed Test step failed as expected"
        echo "Step outcome: $(buildkite-agent step get "outcome" --step "❌ Hard Failed Test")"
      fi
      
      # Check build state
      echo "Build state: $BUILDKITE_BUILD_STATE"
      echo "Build outcome: $BUILDKITE_BUILD_OUTCOME"
      
      echo "✅ Step outcome analysis completed"

notify:
  - slack:
      channels:
        - "#social"
      message: "🚨 Build failed on main branch! <@U09B3AJBVD5> please investigate the failure."
    if: build.state == "failed" && build.branch == "main"
  
  - slack:
      channels:
        - "#social"
      message: "✅ Build passed successfully on main branch! <@U09B3AJBVD5>"
    if: build.state == "passed" && build.branch == "main"
    
