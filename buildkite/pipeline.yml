steps:
  - label: "Validate & Test"
    key: "validate_test"
    command: |
      echo "Starting validate and test stage..."
      echo "This stage will retry on failure and recreate itself with the same key"
      echo "❌ Simulating failure to test retry logic"
      ./buildkite/generate-spinnaker-stage.sh
      exit 1
    retry:
      automatic:
        - exit_status: "*"
          limit: 3