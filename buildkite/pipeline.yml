steps:
  - label: "Flaky Step"
    command: |
      echo "Running flaky command..."
      
      # Fail 50% of the time
      if [ $((RANDOM % 2)) -eq 0 ]; then
        echo "Failed!"
        exit 1
      else
        echo "Success!"
        exit 0
      fi
    
    retry:
      automatic:
        - exit_status: "*"
          limit: 2