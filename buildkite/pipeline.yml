steps:
  - label: ":building_construction: Build Project"
    command: |
      npm run build-storybook

  - label: ":package: Upload Artifacts"
    command: |
      buildkite-agent artifact upload "storybook-static/**/*"

  - wait

  - label: ":mag: Download Artifacts Example"
    command: |
      buildkite-agent artifact download "storybook-static/**/*" .
      echo "Artifacts downloaded to workspace"