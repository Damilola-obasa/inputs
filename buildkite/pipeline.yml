steps:
  - label: "Optional test that fails"
    command: "exit 1"
    soft_fail: true
    retry:
      automatic:
        - exit_status: "*"
          limit: 2
    
  - wait: ~
    continue_on_failure: true

  - block: "Manual approval to continue"
    prompt: "Click to proceed to the main build"

  - label: "Main build that fails first, then passes"
    command: |
      if [ ! -f retry_flag ]; then
        echo "First run, failing and creating flag file."
        touch retry_flag
        exit 1
      else
        echo "Second run, passing!"
        rm retry_flag
        exit 0
      fi
    retry:
      automatic:
        - exit_status: "*"
          limit: 1


