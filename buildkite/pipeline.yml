---
steps:
  - label: ":label: Set Metadata"
    command: |
      buildkite-agent meta-data set "env" "production"
      buildkite-agent meta-data set "version" "1.2.3"

  - label: ":memo: Display Metadata"
    command: |
      ANNOTATION="## Metadata\n\n"
      buildkite-agent meta-data keys | while read key; do
        VALUE=$$(buildkite-agent meta-data get "$$key")
        ANNOTATION="$${ANNOTATION}**$$key:** \`$$VALUE\`\n"
      done
      echo -e "$$ANNOTATION" | buildkite-agent annotate --style info
