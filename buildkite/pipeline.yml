steps:
  - label: "Step 1"
    command: "echo 'Step 1: Success'"

  - label: "Step 2"
    command: "echo 'Step 2: Success'"

  - label: "Step 3"
    command: "echo 'Step 3: Success'"

  - label: "Fail first, then pass"
    command: |
      if [ ! -f retry_flag ]; then
        echo "First run, failing and creating flag file."
        touch retry_flag
        exit 1
      else
        echo "Second run, passing!"
        rm retry_flag
        exit 0
      fi
    retry:
      automatic:
        - exit_status: "*"
          limit: 1


