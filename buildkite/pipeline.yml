steps:
  - label: "Tesst on {{matrix.platform}}-{{matrix.arch}}"
    command: echo "{{matrix.platform}}" "{{matrix.arch}}"
    agents:
      queue: default
    matrix:
      setup:
        arch: ["__placeholder__"]
        platform: ["__placeholder__"]
      adjustments:
        - with: { arch: "__placeholder__", platform: "__placeholder__" }
          skip: true
        - with: { arch: "x86_64", platform: "mac" }
        - with: { arch: "x64", platform: "windows" }
