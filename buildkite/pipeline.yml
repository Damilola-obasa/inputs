steps:
  - label: ":console: Annotations Test"
    command: |
      buildkite-agent annotate 'Example `default` style' --context 'ctx-default'
      buildkite-agent annotate 'Example `info` style' --style 'info' --context 'ctx-info'
      buildkite-agent annotate 'Example `warning` style' --style 'warning' --context 'ctx-warn'
      buildkite-agent annotate 'Example `error` style' --style 'error' --context 'ctx-error'
      buildkite-agent annotate 'Example `success` style' --style 'success' --context 'ctx-success'
      buildkite-agent annotate '<p style="color: #1e90ff;">This is blue text</p>' --style "info"
      buildkite-agent annotate '<span class="yellow">this is yellow</span>' --style "info"
      buildkite-agent annotate "This is info-level annotation (blue background)" --style "info"
      buildkite-agent annotate '<span style="color: blue;">This is blue text</span>' --style info
      buildkite-agent annotate '<span class="yellow">Normal</span>'




