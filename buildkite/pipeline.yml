steps:
  - label: "Run Tests"
    key: "run-tests"
    command: |
      echo "Running tests..."
      sleep 5
      echo "Tests passed!"

  - label: "Publish Coverage"
    key: "publish-coverage"
    command: |
      echo "Publishing coverage report..."
      sleep 10
      echo "Coverage published!"
    depends_on: "run-tests"
    soft_fail: true
