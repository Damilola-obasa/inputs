steps:
  - label: "Guard"
    key: "guard"
    command: |
      echo "BUILDKITE_SOURCE=$BUILDKITE_SOURCE"
      if [ "$BUILDKITE_SOURCE" = "ui" ]; then
        echo "Manual build detected — blocking"
        exit 1
      fi
      echo "Build allowed to continue"

  - label: "Actual work"
    command: |
      echo "Running actual job"
      exit 1
    depends_on: "guard"
