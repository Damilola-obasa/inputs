steps:
  # Stage 1 — parallel starts, no dependencies
  - label: "Setup environment"
    key: "setup-env"
    command: "echo 'Setting up environment'"

  - label: "Fetch dependencies"
    key: "fetch-deps"
    command: "echo 'Fetching dependencies'"

  - label: "Validate config"
    key: "validate-config"
    command: "echo 'Validating config'"

  # Stage 2 — builds, depend on stage 1 in different combos
  - label: "Build frontend"
    key: "build-frontend"
    depends_on:
      - "setup-env"
      - "fetch-deps"
    command: "echo 'Building frontend'"

  - label: "Build backendd"
    key: "build-backend"
    depends_on:
      - "setup-env"
      - "fetch-deps"
    command: "echo 'Building backend'"

  - label: "Build servicsdes"
    key: "build-services"
    depends_on:
      - "setup-env"
      - "fetch-deps"
      - "validate-config"
    command: "echo 'Building services'"

  # Stage 3 — tests, depend on different build steps
  - label: "Unit tests frontend"
    key: "unit-tests-frontend"
    depends_on: "build-frontend"
    command: "echo 'Running frontend unit tests'"

  - label: "Unit tests backend"
    key: "unit-tests-backend"
    depends_on: "build-backend"
    command: "echo 'Running backend unit tests'"

  - label: "Integration tests"
    key: "integration-tests"
    depends_on:
      - "build-frontend"
      - "build-backend"
      - "build-services"
    command: "echo 'Running integration tests'"

  - label: "Security scan"
    key: "security-scan"
    depends_on:
      - "build-backend"
      - "build-services"
    command: "echo 'Running security scan'"

  - label: "Performance tests"
    key: "perf-tests"
    depends_on:
      - "build-frontend"
      - "build-backend"
    command: "echo 'Running performance tests'"

  # Stage 3b — compliance group, depends on validate-config + security-scan
  - group: "Compliance checks"
    key: "compliance"
    depends_on:
      - "validate-config"
      - "security-scan"
    steps:
      - label: "License check"
        command: "echo 'Checking licenses'"
      - label: "Policy check"
        command: "echo 'Checking policies'"
      - label: "Audit log check"
        command: "echo 'Checking audit logs'"

  # Stage 4 — staging deploy, depends on tests passing
  - label: "Deploy to staging"
    key: "deploy-staging"
    depends_on:
      - "unit-tests-frontend"
      - "unit-tests-backend"
      - "integration-tests"
    command: "echo 'Deploying to staging'"

  # Stage 5 — post-staging checks, both depend on deploy-staging
  - label: "Smoke tests"
    key: "smoke-tests"
    depends_on: "deploy-staging"
    command: "echo 'Running smoke tests'"

  - label: "E2E tests"
    key: "e2e-tests"
    depends_on: "deploy-staging"
    command: "echo 'Running E2E tests'"

  # Stage 6 — production deploy, everything must pass
  - label: "Deploy to production"
    key: "deploy-prod"
    depends_on:
      - "smoke-tests"
      - "e2e-tests"
      - "compliance"
      - "perf-tests"
    command: "echo 'Deploying to production'"

  # Final — notify after prod deploy
  - label: "Notify team"
    key: "notify"
    depends_on: "deploy-prod"
    command: "echo 'Notifying team of successful deployment'"
