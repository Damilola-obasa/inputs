steps:
  - label: ":docker: Control - no OCI builder"
    key: "control"
    command: |
      echo "--- Docker config"
      echo "DOCKER_CONFIG=${DOCKER_CONFIG:-not set}"
      echo "BUILDX_BUILDER=${BUILDX_BUILDER:-not set}"
      echo ""
      echo "--- Available builders"
      docker buildx ls

  - label: ":docker: Ephemeral OCI builder"
    key: "oci-builder"
    env:
      USE_OCI_BUILDER: "true"
    command: |
      echo "--- Docker config"
      echo "DOCKER_CONFIG=${DOCKER_CONFIG:-not set}"
      echo "BUILDX_BUILDER=${BUILDX_BUILDER:-not set}"
      echo ""
      echo "--- Available builders (should show ocibuilder-* as active)"
      docker buildx ls
      echo ""
      echo "--- Build a test image using the ephemeral builder"
      echo 'FROM alpine:3.20
      RUN echo "built with ephemeral OCI builder"' | docker buildx build \
        --platform linux/amd64 \
        --output type=image,push=false \
        -f - .
      echo "Build succeeded"
