steps:
  - label: "🔄 Flaky Test"
    key: "test-$(date +%s)"
    command: |
      echo "Running tests that will fail..."
      echo "❌ Test failed"
      exit 1
    retry:
      automatic:
        - exit_status: "*"
          limit: 5

  - label: "🔄 Another Flaky Test"
    key: "test-$(date +%s)"
    command: |
      echo "This step has a dynamic key"
      echo "❌ Test failed"
      exit 1
    retry:
      automatic:
        - exit_status: "*"
          limit: 3

