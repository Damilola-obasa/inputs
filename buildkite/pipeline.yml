steps:
  - label: "Generate Name"
    command: |
      NAME=$(./buildkite/gen_name.sh)
      echo "Script output: $NAME"
      buildkite-agent meta-data set "generated-name" "$NAME"
    
  - label: "Deploy"
    trigger: "deploy-pipeline"
    build:
      env:
        DEPLOY_TARGET_NAME: $(buildkite-agent meta-data get "generated-name")