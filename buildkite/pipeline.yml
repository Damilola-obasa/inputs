---
steps:
  - label: ":hourglass: Check for Timed Out Jobs"
    command: |
      echo "--- Fetching build data"
      RESPONSE=$$(curl -s -H "Authorization: Bearer $$BUILDKITE_API_TOKEN" \
        "https://api.buildkite.com/v2/organizations/$$BUILDKITE_ORGANIZATION_SLUG/builds/$$BUILDKITE_BUILD_NUMBER")

      echo "--- Checking for timeouts"
      TIMED_OUT=$$(echo "$$RESPONSE" | jq -r '.jobs[] | select(.state == "timed_out") | .name')

      if [ -n "$$TIMED_OUT" ]; then
        echo "Found timed out jobs!"
        buildkite-agent annotate --style error <<EOF
      ## :x: Jobs Timed Out Waiting for Agents

      $$TIMED_OUT

      No agents were available for the requested queue.
      EOF
      else
        echo "No timed out jobs found in this build"
      fi
