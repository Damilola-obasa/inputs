steps:
  - label: ":boom: Upstream step (intentionally fails)"
    key: "upstream"
    command: "exit 1"

  - group: ":family: Group depending on failed upstream"
    key: "group"
    depends_on: "upstream"
    steps:
      - label: "Child job A"
        key: "child-a"
        command: "echo 'child A ran'"
      - label: "Child job B"
        key: "child-b"
        command: "echo 'child B ran'"

  - label: ":mag: Downstream inspection step"
    key: "inspect"
    depends_on: "group"
    allow_dependency_failure: true
    command: |
      echo "--- Downstream step is runnable (this line printing confirms it)"

      echo "--- child-a state / outcome"
      buildkite-agent step get state --step "child-a" || echo "(state lookup failed)"
      buildkite-agent step get outcome --step "child-a" || echo "(outcome lookup failed)"

      echo "--- child-b state / outcome"
      buildkite-agent step get state --step "child-b" || echo "(state lookup failed)"
      buildkite-agent step get outcome --step "child-b" || echo "(outcome lookup failed)"

      echo "--- group state / outcome (first check)"
      buildkite-agent step get state --step "group" || echo "(state lookup failed)"
      buildkite-agent step get outcome --step "group" || echo "(outcome lookup failed)"

      echo "--- Waiting 30s to check for delayed resolution"
      sleep 30

      echo "--- group state / outcome (after wait)"
      buildkite-agent step get state --step "group" || echo "(state lookup failed)"
      buildkite-agent step get outcome --step "group" || echo "(outcome lookup failed)"
