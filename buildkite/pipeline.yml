steps:
  # Holds the concurrency slot for 3 minutes
  - label: "Slot holder"
    command: |
      echo "Holding concurrency slot at $(date -u +%T)"
      sleep 180
      echo "Slot released at $(date -u +%T)"
    concurrency: 1
    concurrency_group: "test-concurrency"

  # Waits for the slot with a 1 minute timeout
  # If timeout applies to waiting, this will time out before the slot is free
  - label: "Waiting step (1min timeout)"
    command: echo "Got the slot at $(date -u +%T)"
    concurrency: 1
    concurrency_group: "test-concurrency"
    timeout_in_minutes: 1
