steps:
  - label: ":stopwatch: Prove log-view durations are gaps between outputs"
    command: |
      set -euo pipefail

      echo "=== Step start ==="

      echo "--- Subprocess A (expect ~1s gap)"
      ( echo "A START"; sleep 1; echo "A END" )

      echo "--- Subprocess B (expect ~2s gap)"
      ( echo "B START"; sleep 2; echo "B END" )

      echo "--- Subprocess C (expect ~4s gap)"
      ( echo "C START"; sleep 6; echo "C END" )

      echo "=== Step end ==="
