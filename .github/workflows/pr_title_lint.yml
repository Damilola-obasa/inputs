name: PR Title Lint
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title is a conventional commit
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "Linting PR title: $PR_TITLE"
          if echo "$PR_TITLE" | grep -Eq '^(feat|fix|chore|docs|refactor|test|perf|ci|build|style|revert)(\(.+\))?!?: .+'; then
            echo "PR title is valid"
          else
            echo "PR title must follow Conventional Commits, e.g. 'fix: correct lockfile handling'"
            exit 1
          fi
