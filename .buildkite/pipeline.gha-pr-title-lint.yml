# Buildkite pipeline for the github-actions plugin PR-title-lint test.
#
# This is the step that imports and runs the GitHub Actions workflow via the
# github-actions plugin. The plugin's custom-importer path (explicit `workflow:`)
# requires the step to have a `key` AND the agent to export BUILDKITE_STEP_KEY,
# which only happens on buildkite-agent >= v3.129. On an older agent this step
# fails with:
#   buildkite-gha: upload: BUILDKITE=true and BUILDKITE_STEP_KEY are required
#
# To run end-to-end: make sure your Buildkite pipeline uploads THIS file
# (e.g. the pipeline's steps are `buildkite-agent pipeline upload .buildkite/pipeline.gha-pr-title-lint.yml`),
# enable "Build when a pull request is opened or updated", then open a PR.
steps:
  - label: ":github: GitHub Actions — PR title lint"
    key: github-actions
    plugins:
      - github-actions#v0.17.0:
          version: v0.136.0
          workflow: .buildkite/gha/pr_title_lint.yml
